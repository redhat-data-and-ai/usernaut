apiVersion: operator.dataverse.redhat.com/v1alpha1
kind: Group
metadata:
  labels:
    app.kubernetes.io/name: usernaut
    app.kubernetes.io/managed-by: kustomize
  name: dataverse-aggregate-mygroupquerybased
  namespace: usernaut
spec:
  group_name: dataverse-aggregate-mygroupquerybased
  members:
    ldap_query:
      options:  # deprecated search fallbacks (backward-compatible)
        include_indirect_reports: false
        include_manager: false
      result_options:
        include_only_managers: false
        include_managers_of_result: true
        include_only_managers_of_result: false
      operator: or
      filters:  # key: LDAP attribute (e.g. manager, title, givenName, employeeType, rhatGeo, co, st). See DEVELOPMENT.md for full list.
        - ldap_query:
            operator: or
            filters:
              - key: manager
                criteria: equals
                value: bar  # user ID only (expanded to uid=bar,<baseUserDN>)
                options:
                  include_manager: false
                  include_indirect_reports: false
        - key: manager
          criteria: equals
          value: foo  # user ID only (expanded to uid=foo,<baseUserDN>)
          options:
            include_manager: false
            include_indirect_reports: false
    users:
      - subhatta
      - arijroy
  backends:
  - name: snowflake
    type: snowflake
