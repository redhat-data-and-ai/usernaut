version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - copyloopvar
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      min-occurrences: 6
    revive:
      rules:
        - name: comment-spacings
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST1000"
        - "-ST1003"
        - "-ST1020"
        - "-ST1021"
  exclusions:
    presets: []
    rules:
      - path: "^api/"
        linters:
          - lll
      - path: "^internal/"
        linters:
          - dupl
          - lll
      - path: "_test\\.go"
        linters:
          - dupl
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
